name: Set up native build
description: Install the pinned tools, native dependencies and verified Caddy sidecar
inputs:
  target:
    description: Native Rust target triple
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .node-version
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev \
          libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm xvfb xauth
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Install the repository Rust toolchain
      shell: bash
      run: rustup show active-toolchain
    - name: Verify the runner architecture
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.target }}
      run: node scripts/ci-metadata.mjs --check-host
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: src-tauri -> target
        key: ${{ inputs.target }}
    - shell: bash
      run: pnpm download-caddy
