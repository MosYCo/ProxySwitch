name: Checks

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
  workflow_call:
    outputs:
      matrix:
        description: Validated native build matrix
        value: ${{ jobs.plan.outputs.matrix }}
      version:
        description: Validated application version
        value: ${{ jobs.plan.outputs.version }}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Verify release tag is on the stable branch
        if: github.ref_type == 'tag'
        run: node scripts/verify-release-source.mjs
      - name: Verify versions, release tag and build matrix
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/ci-metadata.mjs
      - run: node scripts/check-public-content.mjs --history
  check:
    name: Check (${{ matrix.id }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.target }}
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run Rust and real Caddy integration tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum cargo test --locked --manifest-path src-tauri/Cargo.toml --target "$BUILD_TARGET"
          else
            cargo test --locked --manifest-path src-tauri/Cargo.toml --target "$BUILD_TARGET"
          fi
      - name: Verify dependency notices
        run: |
          pnpm licenses:generate
          git diff --exit-code -- licenses/DEPENDENCIES.txt
  ui:
    name: UI components and interactions
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ui-test-report
          path: artifacts/ui-tests/
          if-no-files-found: ignore
  status:
    name: Checks passed
    if: always()
    needs: [plan, check, ui]
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: test "$PLAN_RESULT" = success && test "$CHECK_RESULT" = success && test "$UI_RESULT" = success
