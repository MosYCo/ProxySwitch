name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    name: Package (${{ matrix.id }})
    needs: checks
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_BUNDLES: ${{ join(matrix.bundles, ',') }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.target }}
      - name: Build platform installers
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm tauri:build --ci --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.id }}
          path: artifacts/${{ needs.checks.outputs.version }}/
          if-no-files-found: error
  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: artifacts/release-inputs
      - name: Verify all platforms and combine checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/merge-release.mjs
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: artifacts/release-assets/RELEASE_NOTES_${{ needs.checks.outputs.version }}.md
          files: artifacts/release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
