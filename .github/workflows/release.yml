name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    name: Package (${{ matrix.id }})
    needs: checks
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_BUNDLES: ${{ join(matrix.bundles, ',') }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.target }}
      - name: Build platform installers
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri:build --ci --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.id }}
          path: artifacts/${{ needs.checks.outputs.version }}/
          if-no-files-found: error
  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: artifacts/release-inputs
      - name: Verify all platforms and combine checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/merge-release.mjs
      - name: Preserve already published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${encodeURIComponent(process.env.GITHUB_REF_NAME)}`
          const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } })
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`Cannot check existing release (${response.status})`)
            if (!(await response.json()).draft) throw new Error('This version is already public; publish a new version instead of replacing it')
          }
          NODE
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        id: release
        with:
          draft: true
          body_path: artifacts/release-assets/RELEASE_NOTES_${{ needs.checks.outputs.version }}.md
          files: artifacts/release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
      - name: Publish only after every release asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile, readdir } from 'node:fs/promises'
          const directory = 'artifacts/release-assets'
          const base = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/${process.env.RELEASE_ID}`
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
          const response = await fetch(`${base}/assets?per_page=100`, { headers })
          if (!response.ok) throw new Error(`Cannot verify release assets (${response.status})`)
          const assets = await response.json(), names = await readdir(directory)
          if (assets.length !== names.length) throw new Error('Release upload is incomplete; leaving the release as a draft')
          for (const name of names) {
            const asset = assets.find(asset => asset.name === name), bytes = await readFile(`${directory}/${name}`)
            const digest = `sha256:${createHash('sha256').update(bytes).digest('hex')}`
            if (!asset || asset.state !== 'uploaded' || asset.size !== bytes.length || asset.digest && asset.digest !== digest) throw new Error(`Invalid uploaded release asset: ${name}`)
          }
          const published = await fetch(base, { method: 'PATCH', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({ draft: false, prerelease: false, make_latest: 'true' }) })
          if (!published.ok) throw new Error(`Cannot publish completed release (${published.status})`)
          console.log('All installers, signed updates and latest.json verified; release published.')
          NODE
